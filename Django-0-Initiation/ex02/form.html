<!DOCTYPE html>

<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <title>Form</title>
        <style>
            body {background-color: rgb(0, 0, 0); }
            #page-container {display: flex; flex-direction: column; justify-content: flex-end; align-items: center;}
            #form-container {padding-top: 7%; border-radius: 5%; font-size: 20px;}
            form {width: 30%; display: flex; flex-direction: column; align-items: center; color: rgb(34, 168, 7);}
            h1 {color: rgb(34, 168, 7); text-align: center;}
            .text {font-family: 'Courier New', Courier, monospace;}
            input {font-size: 1rem; color: rgb(34, 168, 7); background: transparent; border: none; outline:none; caret-color: rgb(34, 168, 7);}
            .button {background-color: #222121; border-radius: 9%; padding: 12%; font-size: 1.3rem;}
            .button:hover {transform: scale(1.05);}
        </style>
    </head>
    <body>
        <div id="page-container">
            <h1 class="text">42FORM</h1>
            <form class="text">
                    <div id="form-container">
                        <label for="firstname"> Firstname:</label>
                        <input placeholder="write here" type="text" id="firstname" name="firstname" size = "20" required autofocus><br><br>

                        <label style="padding-right: 9%;" for="name">Name:</label>
                        <input placeholder="write here" type="text" id="name" name="name" required><br><br>
                        
                        <label style="padding-right: 11%;" for="age">Age:</label>
                        <input placeholder="write here"  type="number" id="age" name="age"  min="0" required ><br><br>

                        <label for="gender_female">Female</label>
                        <input type="radio" id="gender_female" name="gender" value="Female" required>

                        <label for="gender_male">Male</label>
                        <input type="radio" id="gender_male" name="gender" value="Male" required>

                        <label for="gender_other">Other</label>
                        <input type="radio" id="gender_other" name="gender" value="Other" required><br><br>

                        <label style="padding-right: 7%;" for="phone">Phone:</label>
                        <input type="tel" id="phone" name="phone" placeholder="0123456789" required><br><br>

                        <label style="padding-right: 7%;" for="email">Email:</label>
                        <input placeholder="write here" type="text" id="email" name="email" required><br><br>
                        
                        <label for="student">I am a studuent at 42:</label>
                        <input type="checkbox" id="student" name="student" value="Yes" required><br><br>
                    </div>
                    <div>
                        <input class="button" type="submit" value="SUBMIT" onclick="displayFormContents()">
                    </div>
                    <!-- center submit button -->
                </form>
        </div>
       
    <script src="popup.js"></script>
    </body>
</html>
