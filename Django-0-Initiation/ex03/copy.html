<!DOCTYPE html>

<html lang="en">
    <head>
        <link rel="stylesheet" type="text/css" href="style.css">
        <meta charset="UTF-8">
        <title>Stats</title>
    </head>
    <body>
        <ul>
			<li>
				<h1>Frontend</h1>
				
				<div class="html5" style="position: relative;">
					<p data-value="80"></p>
					<span>HTML5</span>
					<progress class="progress-bar" value="80" max="100">  </progress>
				</div>
				<div class="css3">
					<p data-value="60"></p>
					<span>CSS3</span>
					<progress class="progress-bar" value="60" max="100">  </progress>
					
				</div>
				<div class="jquery" >
					<p data-value="50"></p>
					<span>JQuery</span>
					<progress class="progress-bar" value="50" max="100">  </progress>
					
				</div>
			</li>
			<li>
				<h2>Backend</h2>
				<div class="python">
					<p data-value="75"></p>
					<span>Python</span>
					<progress class="progress-bar" value="75" max="100">  </progress>
					
				</div>
				<div class="php">
					<p data-value="65"></p>
					<span>PHP</span>
					<progress class="progress-bar" value="65" max="100">  </progress>
					
				</div>
				<div class="node-js">
					<p data-value="35"></p>
					<span>Node.js</span>
					<progress class="progress-bar" value="35" max="100">  </progress>
				</div>
			</li>
        </ul>
    </body>
</html>
