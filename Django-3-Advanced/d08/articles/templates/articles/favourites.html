{% extends "base.html" %}
{% load i18n %}

{% load static %}

{% block extra_css %}
 <link rel="stylesheet" href="{% static 'articles/css/articles.css' %}">
{% endblock %}


{% block content %}

<div class="page-content">
    <h2 class="text-center m-4">ARTICLES</h2>
    <div class="tables div-wrapper">
        <div class="div-overlay d-flex flex-column">
            {% for favourite in favourites %}
            <div>
                <a href="{% url 'article-detail' favourite.article.id %}" class="fw-bold">{{ favourite.article.title}}</a>
            </div>
            {% endfor %}

        </div>
    </div>
</div>

{% endblock %}
