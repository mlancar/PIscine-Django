{% extends "base.html" %}

{% load static %}

{% block extra_css %}
 <link rel="stylesheet" href="{% static 'articles/css/articles.css' %}">
{% endblock %}

{% block content %}

<div class="page-content">
    <h2 class="text-center m-4">ARTICLE DETAIL</h2>
    <div class="detail-container div-wrapper">
        <div class="div-overlay d-flex flex-column">
            <h2 class="fw-bold text-center">{{ article.title }}</h2>
            <p class="fst-italic"> {{ article.synopsis}} </p>
            <div>
                <p>{{ article.content }}</p>
            </div>
            <div class="d-flex flex-column text-end">
                <span>-{{ article.author }}</span>
                <span> {{ article.created }}</span>
            </div>
            <form method="post" action="{% url 'articles:add-favourite' article.pk %}">
                {% csrf_token %}
                <button class="btn" type="submit">Add to favourite</button>
            </form>
        </div>
    </div>
</div>

{% endblock %}
