{% extends "base.html" %}

{% block content %}

    <div class="page-content">
        {% if user %}
            <p>Hello <span id="username">{{ user }}</span></p>
        {% else %}
            <p>Hello <span id="username">{{ username }}</span></p>
        {% endif %}
    </div>
    {{ RANDOM_USER_NAMES|json_script:"usernames-data" }}
    <script>
            const usernames = JSON.parse(document.getElementById("usernames-data").textContent);
            function updateUsername() {
                const randomName = usernames[Math.floor(Math.random() * usernames.length)];
                document.getElementById("username").innerText = randomName;
            }
            setInterval(updateUsername, 42000);
        </script>
    
{% endblock %}
