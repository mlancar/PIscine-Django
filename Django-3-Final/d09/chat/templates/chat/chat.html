{% extends "base.html" %}
{% load i18n %}

{% load static %}

{% block extra_css %}
 <link rel="stylesheet" href="{% static 'chat/css/chat.css' %}">
{% endblock %}

{% block content %}

<div class="page-content ">
    <h3 class="text-center m-4">CHATROOMS</h3>
    <div class="div-wrapper">
        <div class="div-overlay p-2 d-flex justify-items-center flex-column">
            {% for room in rooms %}
                <a href="{% url 'chatroom' room_id=room.id %}" class="">{{ room.name }} <br/></a>
            {% endfor %}
        </div>

    </div>
</div>
{% comment %} <script src="{% static 'chat/chat.js' %}"></script> {% endcomment %}

{% endblock %}
