{% extends "base.html" %}
{% load i18n %}

{% load static %}

{% block extra_css %}
 <link rel="stylesheet" href="{% static 'chat/css/chat.css' %}">
{% endblock %}

{% block content %}

<div class="page-content p-4 ">
    <h3 class="text-center p-4"> {{ room }} </h3>
    <div class="d-flex">
        <div class="div-wrapper">
            <div class="pe-4 div-overlay h-100 d-flex flex-column justify-content-start">
                <span>Connected Users</span>
                <ul id="user-list"></ul>
            </div>
        </div>
        <div class="div-wrapper">
            <div class="div-overlay d-flex flex-column">
                <div class="d-flex">
                    <div class="message-comntainer">
                        <div id="chat-log">
                            {% for msg in last_messages %}
                            <div class="message">
                                <small>[{{ msg.timestamp|date:"H:i" }}]</small>
                                <strong>{{ msg.sender.username }}:</strong> {{ msg.content }}
                            </div>
                            {% endfor %}
                        </div>
                        <form hx-ws="send:submit">
                            <input id="chat-message-input" type="text" size="50" />
                            <input id="chat-message-submit" type="button" value="Send" />
                        </form>
                        
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        const roomId = "{{ room.id }}";
        const chatLog = $("#chat-log");
        let chatSocket;
        let reconnectAttempts = 0;
        const MAX_RECONNECT = 5;

        function leaveChat() {
            if (chatSocket && chatSocket.readyState === WebSocket.OPEN) {
                chatSocket.send(JSON.stringify({ type: 'leave' }));
            }
        }
        $('a').on('click', function () {
                leaveChat();
            });

        function connectWebSocket() {
            chatSocket = new WebSocket(
                'ws://' + window.location.host + '/ws/chat/' + roomId + '/'
            );

            chatSocket.onopen = function(e) {
                reconnectAttempts = 0;
            };

            chatSocket.onmessage = function(e) {
                const data = JSON.parse(e.data);

                if (data.type == 'user_list') {
                    const userListElement = $('#user-list');
                    userListElement.empty();
                    data.users.forEach(username => {
                        const li = document.createElement('li');
                        li.innerText = username;
                        userListElement.append(li);
                    });
                    return;
                }

                const newMessage = document.createElement('div');
                newMessage.innerHTML = `${data.message}`;
                chatLog.append(newMessage);
                chatLog.scrollTop(chatLog[0].scrollHeight);
            };

            chatSocket.onclose = function(e) {
                if (reconnectAttempts < MAX_RECONNECT) {
                    reconnectAttempts++;
                    const delay = Math.min(500 * 2 ** reconnectAttempts, 10000);
                    setTimeout(connectWebSocket, delay);
                }
            };

            chatSocket.onerror = function(e) {
                chatSocket.close();
            };
        }

        connectWebSocket();

        $("#chat-message-input").focus();

        function sendMessage() {
            const messageInputDom = $("#chat-message-input");
            const message = messageInputDom.val().trim();
            if (message === "") return;

            if (chatSocket.readyState === WebSocket.OPEN) {
                chatSocket.send(JSON.stringify({ message: message }));
                messageInputDom.val('');

            }
            else {
                console.warn("Socket not connected");
            }
        }

        $("#chat-message-input").on("keydown", function(e) {
            if (e.key === "Enter") {
                e.preventDefault();
                sendMessage();
            }
        });

        $("#chat-message-submit").on('click', function (e) {
            e.preventDefault();
            sendMessage();
        });

    </script>
</div>


{% endblock %}
