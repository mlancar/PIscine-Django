{% extends "base.html" %}
{% load i18n %}

{% load static %}

{% block extra_css %}
 <link rel="stylesheet" href="{% static 'account/css/account.css' %}">
{% endblock %}

{% block content %}

<div class="page-content">
    <h2 class="text-center m-4"></h2>
    <div class="tables div-wrapper">
        <div id="login-container" class="div-overlay">
            <form method="post">
                {% csrf_token %}
                <button type="submit" name="login_submit" class="btn">Login</button>
                {{ login_form.as_p }}
            </form>
        </div>
    </div>
    <div class="div-wrapper">
        <div class="div-overlay register-container">
            <h3>REGISTER</h3>
            <form method="post">
                {% csrf_token %}
                {{ register_form.as_p }}
                <button type="submit" name="register_submit" class="btn">Register</button>
            </form>
        </div>
    </div>

</div>

{% endblock %}
