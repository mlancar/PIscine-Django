{% extends "base.html" %}
{% load i18n %}

{% load static %}

{% block extra_css %}
 <link rel="stylesheet" href="{% static 'account/css/account.css' %}">
{% endblock %}

{% block content %}

<div class="page-content">
    <h2 class="text-center m-4"></h2>
    <div class="tables div-wrapper">
        <div class="div-overlay">
            <form id="login-form" method="post" class="div-overlay btn-no-hover d-flex flex-column">
                {% csrf_token %}

                {% for field in form %}
                    <div class="mb-3">
                        {{ field.label_tag }}
                        {{ field }}
                    </div>
                {% endfor %}
                
                <button class="btn-submit" type="submit">{% trans "Submit" %}</button>
            </form>
        </div>
    </div>
</div>

{% endblock %}
